<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="common/head :: head_fragment(title = 'アイドル情報編集', scripts = ~{::script}, links = ~{::link})"></head>

<body>
	<div class="container">
		<div th:if="${validationError}" th:each="error : ${validationError}">
			<label class="text-danger" th:text="${error}"></label>
		</div>
		<h1>アイドル情報編集</h1>


		<form th:action="@{/idol/update}" th:object="${idolUpdateRequest}" th:method="post">
			<input type="hidden" th:field="*{id}" />
			<div>
				<div class="row mx-md-n5">
					<div class="col-2 pt-3 border bg-light">名前<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<input type="text" class="form-control" th:field="*{name}">
					</div>
				</div>
				<div class="row mx-md-n5">
					<div class="col-2 pt-3 border bg-light">所属グループ<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<input type="text" class="form-control" th:field="*{group_name}">
					</div>
				</div>
				<div class="row mx-md-n5">
					<div class="col-2 pt-3 border bg-light">生年月日<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<input type="text" class="form-control" th:field="*{birth_day}">
					</div>
				</div>
				<div class="row mx-md-n5">
					<div class="col-2 pt-3 border bg-light">出身<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<input type="text" class="form-control" th:field="*{birth_place}">
					</div>
				</div>
			</div>


			<div class="text-center">
				<input type="submit" class="btn btn-primary" value="　保存　">
				<a th:href="@{/idol/{id}(id=*{id})}" class="btn btn-secondary">キャンセル</a>
			</div>
		</form>
	</div>
</body>

</html>
