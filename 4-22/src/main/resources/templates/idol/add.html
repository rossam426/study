<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
 xmlns:th="http://www.thymeleaf.org">
<head
 th:replace="common/head :: head_fragment(title = '好きなアイドルを登録', scripts = ~{::script}, links = ~{::link})"></head>
<body>
 <div class="container">
   <div th:if="${validationError}" th:each="error : ${validationError}">
     <label class="text-danger" th:text="${error}"></label>
   </div>
   <h1>好きなアイドルを登録</h1>
   <form th:action="@{/idol/create}" th:object="${idolRequest}" th:method="post">


     <div class="form-group">
       <label>名前：<span class="text-danger">※</span></label>
       <input type="text" th:field="*{name}" class="form-control">
     </div>
	 
	 <div class="form-group">
	   <label>所属グループ：<span class="text-danger">※</span></label>
	   <input type="text" th:field="*{group_name}" class="form-control">
	 </div>
	 
	 <div class="form-group">
	   <label>生年月日：<span class="text-danger">※</span></label>
	   <input type="date" th:field="*{birth_day}" class="form-control">
	 </div>

	 <div class="form-group">
	   <label>出身：<span class="text-danger">※</span></label>
	   <input type="text" th:field="*{birth_place}" class="form-control">
	 </div>

     <div class="text-center">
       <a href="/idol/list" class="btn btn-secondary">キャンセル</a>
       <input type="submit" value="登録" class="btn btn-primary">
     </div>
   </form>
 </div>
</body>
</html>
