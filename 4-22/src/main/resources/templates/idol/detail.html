<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="common/head :: head_fragment(title = 'アイドル情報詳細', scripts = ~{::script}, links = ~{::link})"></head>

<body>
	<div class="container">
		<h1>アイドル情報詳細</h1>
		<div th:object="${idol}">
			<div class="row mx-md-n5">
				<div class="col-2 pt-3 border bg-light">名前</div>
				<div class="col pt-3 border">
					<p th:text="*{name}"></p>
				</div>
			</div>
			<div class="row mx-md-n5">
				<div class="col-2 pt-3 border bg-light">所属グループ</div>
				<div class="col pt-3 border">
					<p th:text="*{group_name}"></p>
				</div>
			</div>
			<div class="row mx-md-n5">
				<div class="col-2 pt-3 border bg-light">生年月日</div>
				<div class="col pt-3 border">
					<p th:text="*{birth_day}"></p>
				</div>
			</div>
			<div class="row mx-md-n5">
				<div class="col-2 pt-3 border bg-light">出身</div>
				<div class="col pt-3 border">
					<p th:text="*{birth_place}"></p>
				</div>
			</div>
		</div>
		<br />
		<div class="text-center">
			<a th:href="@{/idol/{id}/edit(id=*{id})}" class="btn btn-primary">　編集　</a>
			<a th:href="@{/idol/{id}/delete(id=*{id})}" class="btn btn-secondary">　削除　</a>
			<a href="/idol/list" class="btn btn-secondary">一覧に戻る</a>
		</div>
	</div>
</body>

</html>
